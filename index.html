<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>KrishMitra — your farming companion</title>
<meta name="description" content="KrishMitra: personalized crop, soil and farm guidance in your own language." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-950:#14231a;
    --soil-900:#1b3226;
    --soil-800:#22432f;
    --soil-700:#2d5a3f;
    --leaf-500:#5fbf73;
    --leaf-400:#7fd191;
    --clay-600:#b5652d;
    --clay-500:#c97b3f;
    --mustard-500:#d9a441;
    --cream-100:#faf7ef;
    --cream-200:#f2ecdc;
    --cream-300:#e8dfc6;
    --ink-900:#17211a;
    --ink-600:#48594e;
    --ink-400:#7a8a7d;
    --line:#dcd3ba;
    --danger:#a13a2e;
    --on-dark:#faf7ef;
    --radius-sm:6px;
    --radius-md:12px;
    --radius-lg:22px;
    --shadow-soft:0 10px 30px -14px rgba(20,35,26,0.35);
    --font-display:'Fraunces', serif;
    --font-body:'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--cream-100);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  a,button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.08;font-weight:600;color:var(--soil-950);}
  p{margin:0;line-height:1.55;}
  .muted{color:var(--ink-600);}

  /* ---------- Splash ---------- */
  .splash{
    position:fixed;inset:0;z-index:200;
    background:radial-gradient(120% 120% at 20% 0%, var(--soil-800) 0%, var(--soil-950) 65%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    animation:splashOut .5s ease 2.1s forwards;
  }
  @keyframes splashOut{to{opacity:0;visibility:hidden;}}
  .splash-logo{animation:riseIn .7s ease both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.92);}to{opacity:1;transform:none;}}
  .splash-name{font-family:var(--font-display);font-size:30px;color:var(--on-dark);letter-spacing:.01em;animation:riseIn .7s ease .12s both;}
  .splash-tag{color:#b9c9bb;font-size:14px;animation:riseIn .7s ease .22s both;}
  .splash-dots{display:flex;gap:6px;margin-top:6px;}
  .splash-dots span{width:6px;height:6px;border-radius:50%;background:var(--leaf-400);animation:dotPulse 1.1s ease infinite;}
  .splash-dots span:nth-child(2){animation-delay:.15s;}
  .splash-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}

  /* ---------- Header / nav ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--soil-950);color:var(--on-dark);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.01em;}
  .icon-btn{
    background:transparent;border:1px solid rgba(250,247,239,.22);color:var(--on-dark);
    width:38px;height:38px;border-radius:10px;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:rgba(250,247,239,.08);}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .pill-btn{
    background:transparent;border:1px solid rgba(250,247,239,.28);color:var(--on-dark);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;
  }
  .pill-btn:hover{background:rgba(250,247,239,.1);}

  nav.drawer{
    position:fixed;inset:0 auto 0 0;width:min(78vw,300px);z-index:60;
    background:var(--soil-900);color:var(--on-dark);
    padding:22px 18px;display:flex;flex-direction:column;gap:4px;
    transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
    box-shadow:20px 0 50px -20px rgba(0,0,0,.5);
  }
  nav.drawer.open{transform:translateX(0);}
  .drawer-scrim{position:fixed;inset:0;background:rgba(15,20,16,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s;}
  .drawer-scrim.show{opacity:1;pointer-events:auto;}
  nav.drawer .brand{margin-bottom:18px;color:var(--on-dark);}
  nav.drawer button{
    text-align:left;background:transparent;border:0;color:#dbe6dd;
    padding:12px 10px;border-radius:10px;font-size:15px;
  }
  nav.drawer button:hover{background:rgba(250,247,239,.08);color:#fff;}
  nav.drawer button.active{background:rgba(95,191,115,.16);color:var(--leaf-400);font-weight:600;}
  nav.drawer .drawer-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(250,247,239,.14);font-size:12px;color:#8fa093;}

  /* ---------- Layout shells ---------- */
  main{flex:1;display:flex;flex-direction:column;}
  .screen-enter{animation:fadeUp .38s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* Hero */
  .hero{
    max-width:640px;margin:0 auto;padding:56px 22px 40px;text-align:left;width:100%;
  }
  .eyebrow-pill{
    display:inline-block;background:var(--cream-200);border:1px solid var(--line);
    color:var(--soil-700);font-size:12px;font-weight:600;letter-spacing:.03em;
    padding:6px 12px;border-radius:999px;margin-bottom:18px;
  }
  .hero h1{font-size:clamp(30px,5vw,46px);margin-bottom:14px;}
  .hero p.lead{font-size:17px;color:var(--ink-600);max-width:50ch;margin-bottom:26px;}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:38px;}
  .btn{
    border:0;border-radius:999px;padding:13px 24px;font-size:15px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--soil-950);color:var(--on-dark);}
  .btn.primary:hover{box-shadow:var(--shadow-soft);}
  .btn.secondary{background:transparent;color:var(--soil-950);border:1.5px solid var(--soil-950);}
  .btn.secondary:hover{background:var(--cream-200);}
  .btn.full{width:100%;justify-content:center;}
  .btn.ghost{background:transparent;color:var(--soil-700);text-decoration:underline;padding:8px 4px;}
  .btn[disabled]{opacity:.55;pointer-events:none;}

  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .feature-card{
    background:var(--cream-200);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 16px;
  }
  .feature-card b{display:block;font-family:var(--font-display);font-size:16px;margin-bottom:4px;color:var(--soil-950);}
  .feature-card p{font-size:13.5px;color:var(--ink-600);}

  /* Panels (auth / onboarding / vision / soil) */
  .panel{max-width:520px;margin:0 auto;padding:44px 22px 60px;width:100%;}
  .panel h2{font-size:26px;margin-bottom:8px;}
  .panel .subtitle{color:var(--ink-600);margin-bottom:26px;font-size:14.5px;}
  label.field{display:block;margin-bottom:16px;font-size:13.5px;font-weight:600;color:var(--soil-800);}
  label.field .req{color:var(--clay-600);}
  input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
    display:block;width:100%;margin-top:7px;padding:12px 13px;border-radius:var(--radius-sm);
    border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink-900);font-weight:400;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf-500);outline-offset:1px;border-color:var(--leaf-500);}
  .error-box{
    background:#fbeae6;border:1px solid #eec3ba;color:var(--danger);
    padding:10px 13px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:16px;
  }
  .notice-box{
    background:#eaf3ea;border:1px solid #c8dfc9;color:var(--soil-700);
    padding:10px 13px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:16px;
  }
  .form-actions{display:flex;gap:10px;margin-top:22px;}
  .locate-btn{
    display:flex;align-items:center;gap:8px;width:100%;justify-content:center;
    background:var(--cream-200);border:1.5px dashed var(--line);color:var(--soil-800);
    padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;margin-bottom:18px;
  }
  .progress{font-size:12.5px;color:var(--ink-600);font-weight:600;margin-bottom:18px;}
  .progress .bar{margin-top:7px;height:5px;background:var(--cream-300);border-radius:999px;overflow:hidden;}
  .progress .bar i{display:block;height:100%;background:var(--leaf-500);transition:width .3s ease;}

  /* Dashboard */
  .dashboard{max-width:640px;margin:0 auto;padding:36px 22px 60px;width:100%;}
  .demo-tag{
    background:var(--mustard-500);color:var(--soil-950);font-size:12px;font-weight:700;
    letter-spacing:.03em;padding:6px 12px;border-radius:999px;display:inline-block;margin-bottom:16px;
  }
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--clay-600);margin-bottom:4px;}
  .dashboard h2{font-size:27px;margin-bottom:4px;}
  .dashboard .loc{margin-bottom:22px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .stat-grid .feature-card p{font-size:14px;color:var(--soil-950);font-weight:500;}
  .dash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .dash-actions .btn{flex:1;min-width:170px;}
  .soil-bar{
    width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    background:var(--soil-950);color:var(--on-dark);border:0;border-radius:var(--radius-lg);
    padding:16px 18px;margin-top:6px;
  }
  .soil-bar:hover{background:var(--soil-900);}
  .soil-icon{font-size:26px;}
  .soil-bar b{display:block;font-family:var(--font-display);font-size:16px;font-weight:600;}
  .soil-bar small{color:#b9c9bb;font-size:12.5px;}
  .soil-arrow{margin-left:auto;font-size:18px;}

  /* Chat */
  .talk{max-width:600px;margin:0 auto;padding:30px 18px 0;width:100%;display:flex;flex-direction:column;height:calc(100vh - 60px);}
  .talk h2{font-size:23px;}
  .talk .subtitle{margin-bottom:14px;}
  .chat{flex:1;overflow-y:auto;padding:6px 2px 16px;display:flex;flex-direction:column;gap:10px;}
  .chat .empty{color:var(--ink-400);font-size:14px;text-align:center;margin-top:40px;}
  .bubble{max-width:82%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;}
  .bubble.user{align-self:flex-end;background:var(--soil-950);color:var(--on-dark);border-bottom-right-radius:4px;}
  .bubble.assistant{align-self:flex-start;background:var(--cream-200);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .composer{
    display:flex;gap:8px;padding:12px 2px 18px;border-top:1px solid var(--line);
    position:sticky;bottom:0;background:var(--cream-100);
  }
  .composer input{flex:1;margin:0;}
  .composer button.mic{
    background:var(--cream-200);border:1.5px solid var(--line);border-radius:50%;
    width:44px;height:44px;font-size:16px;flex:none;
  }
  .composer button.mic.recording{background:var(--danger);color:#fff;border-color:var(--danger);}
  .composer .btn.primary{border-radius:50%;width:44px;height:44px;padding:0;flex:none;}

  /* Vision / soil */
  .upload-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    border:2px dashed var(--line);border-radius:var(--radius-md);padding:30px 16px;
    text-align:center;cursor:pointer;background:var(--cream-200);margin-bottom:14px;
  }
  .upload-box:hover{border-color:var(--leaf-500);}
  .upload-box .icon{font-size:30px;}
  .upload-box input{display:none;}
  .file-name{font-size:13.5px;color:var(--ink-600);margin-bottom:12px;}
  .result-box{
    margin-top:18px;background:var(--cream-200);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:16px 17px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  }
  .result-box b{display:block;font-family:var(--font-display);margin-bottom:8px;color:var(--soil-950);}
  .disclaimer{font-size:12.5px;color:var(--ink-400);margin-top:14px;}
  .soil-heading{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
  .soil-heading .icon.large{font-size:30px;}

  /* Treatment method boxes (pesticide / organic / combined) */
  .method-stack{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .method-box{
    border-radius:var(--radius-md);padding:16px 17px;font-size:14.5px;line-height:1.6;
    border:1px solid var(--line);border-left-width:5px;background:var(--cream-200);
  }
  .method-box .method-title{
    display:flex;align-items:center;gap:8px;font-family:var(--font-display);
    font-size:15.5px;font-weight:600;margin-bottom:8px;color:var(--soil-950);
  }
  .method-box .method-tag{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;color:#fff;
  }
  .method-box.pesticide{border-left-color:var(--clay-600);}
  .method-box.pesticide .method-tag{background:var(--clay-600);}
  .method-box.organic{border-left-color:var(--leaf-500);}
  .method-box.organic .method-tag{background:var(--soil-700);}
  .method-box.combined{border-left-color:var(--mustard-500);}
  .method-box.combined .method-tag{background:#8a6a17;}
  .method-box .method-body{white-space:pre-wrap;}

  /* Expert page */
  .expert-card{
    background:var(--cream-200);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:18px 18px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;
  }
  .expert-avatar{
    width:46px;height:46px;border-radius:50%;background:var(--soil-950);color:var(--on-dark);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-size:17px;font-weight:600;flex:none;
  }
  .expert-card b{display:block;font-family:var(--font-display);font-size:16.5px;color:var(--soil-950);}
  .expert-role{font-size:12.5px;color:var(--clay-600);font-weight:600;margin:2px 0 6px;}
  .expert-focus{font-size:13.5px;color:var(--ink-600);margin-bottom:8px;}
  .expert-contact{display:flex;flex-wrap:wrap;gap:8px;}
  .expert-contact a{
    font-size:13px;font-weight:600;color:var(--soil-800);text-decoration:none;
    background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:999px;
  }
  .expert-contact a:hover{background:var(--cream-300);}
  .helpline-card{
    background:var(--soil-950);color:var(--on-dark);border-radius:var(--radius-lg);
    padding:18px 20px;margin-bottom:18px;
  }
  .helpline-card b{display:block;font-family:var(--font-display);font-size:16px;margin-bottom:4px;color:var(--on-dark);}
  .helpline-card p{font-size:13.5px;color:#cfe0d0;}
  .helpline-card a{color:var(--leaf-400);font-weight:700;text-decoration:none;}
  .expert-note{font-size:12.5px;color:var(--ink-400);margin-top:4px;margin-bottom:18px;}

  /* Settings modal (API key) */
  .modal-scrim{position:fixed;inset:0;background:rgba(15,20,16,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.modal-scrim{align-items:center;}}
  .modal{
    background:#fff;border-radius:20px 20px 0 0;padding:26px 22px 30px;width:100%;max-width:460px;
    max-height:88vh;overflow:auto;
  }
  @media(min-width:640px){.modal{border-radius:20px;}}
  .modal h3{font-size:19px;margin-bottom:6px;}
  .modal .subtitle{margin-bottom:18px;}
  .key-note{
    background:#fbf3e4;border:1px solid #ecdcb0;color:#7a5a12;font-size:12.5px;
    padding:10px 12px;border-radius:var(--radius-sm);margin-top:14px;line-height:1.5;
  }

  .footer-space{height:8px;}
  @media(max-width:480px){
    .hero,.panel,.dashboard{padding-left:18px;padding-right:18px;}
  }

  /* ---------- Dark mode ---------- */
  :root[data-theme="dark"]{
    --cream-100:#12160f;
    --cream-200:#1b2117;
    --cream-300:#232b1d;
    --ink-900:#eef0e6;
    --ink-600:#b7c0ac;
    --ink-400:#8a9280;
    --line:#333c2b;
  }
  :root[data-theme="dark"] body{background:var(--cream-100);color:var(--ink-900);}
  :root[data-theme="dark"] input[type=text],
  :root[data-theme="dark"] input[type=tel],
  :root[data-theme="dark"] input[type=number],
  :root[data-theme="dark"] input[type=date],
  :root[data-theme="dark"] select,
  :root[data-theme="dark"] textarea{background:#1b2117;color:var(--ink-900);border-color:var(--line);}
  :root[data-theme="dark"] .error-box{background:#3a201c;border-color:#5a3128;color:#ff9d8a;}
  :root[data-theme="dark"] .notice-box{background:#1e2c1e;border-color:#33502f;color:#a8d6a8;}
  :root[data-theme="dark"] .key-note{background:#332c17;border-color:#5a4a1f;color:#e0c477;}
  :root[data-theme="dark"] .modal{background:#1b2117;color:var(--ink-900);}
  :root[data-theme="dark"] .bubble.assistant{background:var(--cream-200);border-color:var(--line);color:var(--ink-900);}
  /* Headings and labels used var(--soil-950/800/700) — dark green — which is fine on the
     light cream surfaces, but those same surfaces turn dark in dark mode, so this text
     needs to switch to a light color too, or it disappears. */
  :root[data-theme="dark"] h1,
  :root[data-theme="dark"] h2,
  :root[data-theme="dark"] h3,
  :root[data-theme="dark"] .feature-card b,
  :root[data-theme="dark"] .result-box b,
  :root[data-theme="dark"] .stat-grid .feature-card p,
  :root[data-theme="dark"] label.field,
  :root[data-theme="dark"] .locate-btn{color:var(--ink-900);}
  :root[data-theme="dark"] .btn.secondary{color:var(--ink-900);border-color:var(--ink-600);}
  :root[data-theme="dark"] .btn.ghost,
  :root[data-theme="dark"] .eyebrow-pill{color:var(--leaf-400);}
  .theme-toggle{font-size:16px;}
</style>
</head>
<body>
<div id="root"></div>

  function tpl(s, vars){
    if(!vars) return s;
    return String(s==null?"":s).replace(/\{(\w+)\}/g, function(m,k){
      return Object.prototype.hasOwnProperty.call(vars,k) ? vars[k] : m;
    });
  }

  function mergeUI(base, partial){
    if(Array.isArray(base)){
      return (Array.isArray(partial) && partial.length===base.length) ? partial : base;
    }
    if(base && typeof base === "object"){
      if(!partial || typeof partial !== "object") return base;
      var out = {};
      for(var k in base){ out[k] = mergeUI(base[k], partial[k]); }
      return out;
    }
    return (typeof partial === "string" && partial.trim()) ? partial : base;
  }

  function uiCacheKey(lang){ return "km_ui_v1_"+lang; }

  function translateUI(lang){
    lang = lang || "English";
    if(lang==="English"){
      state.ui = UI_EN; state.uiLang="English"; state.uiLoading=false; render();
      return;
    }
    if(state.uiLang===lang && state.ui && !state.uiLoading) return;
    try{
      var cached = localStorage.getItem(uiCacheKey(lang));
      if(cached){
        state.ui = mergeUI(UI_EN, JSON.parse(cached));
        state.uiLang = lang; state.uiLoading = false;
        render();
        return;
      }
    }catch(e){}
    state.uiLoading = true; state.uiLang = lang; render();
    var sys = "You are a precise UI-string translator for an Indian farming app. Translate every string value in the given JSON object into "+lang+", using simple, everyday, farmer-friendly vocabulary (not formal or literary). Preserve the exact same JSON keys and nesting — never add, remove, or rename keys. NEVER translate, remove, or alter any {placeholder} tokens — copy them exactly as written, curly braces included. Keep emoji characters exactly as given. Respond with ONLY the raw JSON object as your entire reply — no markdown code fences, no explanation, no extra text before or after.";
    callClaude(sys, [{role:"user", content: JSON.stringify(UI_EN)}]).then(function(data){
      var raw = (extractReply(data)||"").trim();
      raw = raw.replace(/^```[a-zA-Z]*\s*/,"").replace(/```\s*$/,"").trim();
      var parsed = JSON.parse(raw);
      var merged = mergeUI(UI_EN, parsed);
      state.ui = merged;
      try{ localStorage.setItem(uiCacheKey(lang), JSON.stringify(merged)); }catch(e){}
    }).catch(function(){
      state.ui = UI_EN;
    }).finally(function(){
      state.uiLoading = false; render();
    });
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }
  function loadReminder(){
    try{
      var raw = localStorage.getItem("km_reminder_v1");
      var r = raw ? JSON.parse(raw) : null;
      if(!r || r.date !== todayStr()) r = {date:todayStr(), status:null, postponedAt:0};
      if(r.status==="postponed" && r.postponedAt && (Date.now()-r.postponedAt > 2*60*60*1000)){
        r.status = null;
      }
      return r;
    }catch(e){ return {date:todayStr(), status:null, postponedAt:0}; }
  }

  /* ---------------- events ---------------- */
  function wireEvents(){
    root.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", onAction);
    });
    var authForm = document.getElementById("authForm");
    if(authForm) authForm.addEventListener("submit", onAuthSubmit);
    var onboardForm = document.getElementById("onboardForm");
    if(onboardForm) onboardForm.addEventListener("submit", onOnboardSubmit);
    var chatForm = document.getElementById("chatForm");
    if(chatForm) chatForm.addEventListener("submit", onChatSubmit);
    var visionFile = document.getElementById("visionFile");
    if(visionFile) visionFile.addEventListener("change", function(e){
      state.vision.file = e.target.files[0]||null;
      state.vision.result=""; state.vision.error=""; state.vision.sections=null;
      render();
    });
    var soilFile = document.getElementById("soilFile");
    if(soilFile) soilFile.addEventListener("change", function(e){
      state.soil.file = e.target.files[0]||null;
      state.soil.result=""; state.soil.error="";
      render();
    });
    var stateSelect = document.getElementById("stateSelect");
    if(stateSelect) stateSelect.addEventListener("change", function(e){
      var distSel = document.getElementById("districtSelect");
      if(distSel) distSel.innerHTML = districtOptionsHtml(e.target.value, "");
    });
    var quickLangSelect = document.getElementById("quickLangSelect");
    if(quickLangSelect) quickLangSelect.addEventListener("change", function(e){
      state.farmer.language = e.target.value;
      saveFarmer();
      translateUI(e.target.value);
    });
    var onboardLangSelect = document.getElementById("onboardLangSelect");
    if(onboardLangSelect) onboardLangSelect.addEventListener("change", function(e){
      state.farmer.language = e.target.value;
      saveFarmer();
      translateUI(e.target.value);
    });
    var chatScroll = document.getElementById("chatScroll");
    if(chatScroll) chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function onAction(e){
    var el = e.currentTarget;
    var action = el.getAttribute("data-action");
    if(action==="toggle-menu"){ state.menuOpen = !state.menuOpen; render(); }
    else if(action==="close-menu"){ state.menuOpen=false; render(); }
    else if(action==="nav"){
      state.menuOpen=false; state.notice="";
      var scr = el.getAttribute("data-screen");
      if(scr==="onboard") state.step = 1;
      state.screen = scr;
      render();
      if(scr==="dash" || scr==="demo") maybeFetchWeather();
    }
    else if(action==="reminder-water"){ state.reminder.status="watered"; saveReminder(); render(); }
    else if(action==="reminder-skip"){ state.reminder.status="skipped"; saveReminder(); render(); }
    else if(action==="reminder-postpone"){ state.reminder.status="postponed"; state.reminder.postponedAt=Date.now(); saveReminder(); render(); }
    else if(action==="reminder-undo"){ state.reminder.status=null; saveReminder(); render(); }
    else if(action==="toggle-theme"){ state.theme = state.theme==="dark"?"light":"dark"; saveTheme(); render(); }
    else if(action==="go-auth"){ state.notice=""; state.screen="auth"; render(); }
    else if(action==="logout"){
      state.farmer = Object.assign({},BLANK_FARMER);
      try{ localStorage.removeItem("km_farmer_v1"); }catch(e){}
      state.screen="home"; render();
    }
    else if(action==="open-settings"){ state.settingsOpen=true; state.menuOpen=false; render(); }
    else if(action==="close-settings"){ state.settingsOpen=false; render(); }
    else if(action==="save-settings"){
      state.settingsOpen=false; render();
    }
    else if(action==="onboard-back"){ state.step = Math.max(1,state.step-1); render(); }
    else if(action==="locate"){ doLocate(); }
    else if(action==="mic"){ doMic(); }
    else if(action==="analyze-vision"){ analyzeVision(); }
    else if(action==="analyze-soil"){ analyzeSoil(); }
  }

  function onAuthSubmit(e){
    e.preventDefault();
    var name = document.getElementById("authName").value.trim();
    if(!name){ state.notice=state.ui.auth.errorEmptyName; render(); return; }
    state.farmer.name = name;
    state.notice="";
    if(state.farmer.onboardingComplete){ state.screen="dash"; }
    else { state.step=1; state.screen="onboard"; }
    saveFarmer();
    render();
  }

  var REQUIRED = {1:["language"],2:["name","age"],3:["state","district","mandal","village","pin"],4:["farmSize","irrigation","water"],5:["crop","growthStage"]};
  function onOnboardSubmit(e){
    e.preventDefault();
    var form = e.target;
    var data = new FormData(form);
    data.forEach(function(v,k){ state.farmer[k]=v; });
    var missing = (REQUIRED[state.step]||[]).find(function(k){ return !String(state.farmer[k]||"").trim(); });
    if(missing){ state.notice=state.ui.onboard.errorRequired; render(); return; }
    state.notice="";
    if(state.step<5){ state.step++; render(); return; }
    state.farmer.onboardingComplete = true;
    saveFarmer();
    state.screen="dash";
    render();
  }

  function doLocate(){
    if(!navigator.geolocation){ state.notice=state.ui.onboard.locateUnavailable; render(); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      state.farmer.latitude = pos.coords.latitude;
      state.farmer.longitude = pos.coords.longitude;
      state.notice = state.ui.onboard.locateSuccess;
      render();
    }, function(){
      state.notice = state.ui.onboard.locateDenied;
      render();
    });
  }

  function doMic(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert("Speech recognition is not supported by this browser."); return; }
    var rec = new SR();
    rec.lang = SPEECH_LANG_CODES[state.farmer.language] || "en-IN";
    rec.onstart = function(){ state.chat.voice=true; render(); };
    rec.onresult = function(ev){
      var input = document.getElementById("chatInput");
      if(input) input.value = ev.results[0][0].transcript;
    };
    rec.onerror = function(){ alert("Microphone permission or speech recognition failed."); };
    rec.onend = function(){ state.chat.voice=false; render(); };
    rec.start();
  }

  /* ---------------- AI proxy config ----------------
     Browsers can never call api.anthropic.com directly with a real key
     (the key would be exposed to everyone who views page source, and
     the API blocks cross-origin browser calls anyway). So this app
     calls a small serverless proxy YOU deploy, which holds the real
     Anthropic API key server-side and forwards the request.
     Paste your deployed proxy URL below before hosting this app. */
  var CLAUDE_PROXY_URL = "https://YOUR-WORKER-SUBDOMAIN.workers.dev/";

  function callClaude(systemText, messages){
    return fetch(CLAUDE_PROXY_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system:systemText,
        messages:messages
      })
    }).then(function(r){
      return r.json().then(function(data){
        if(!r.ok) throw new Error((data && data.error && data.error.message) || "AI request failed.");
        return data;
      });
    });
  }

  function extractReply(data){
    if(!data || !data.content) return "";
    return data.content.filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n").trim();
  }

  function dataUrlParts(dataUrl){
    var m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl||"");
    return m ? {mediaType:m[1], data:m[2]} : null;
  }

  function onChatSubmit(e){
    e.preventDefault();
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if(!text || state.chat.busy) return;
    if(!requireKey()) return;
    input.value="";
    state.chat.msgs.push({role:"user",content:text});
    state.chat.busy=true;
    render();
    var history = state.chat.msgs.slice(-12).map(function(m){return {role:m.role,content:m.content};});
    var lang = state.farmer.language || "English";
    var sys = "You are KrishMitra, a careful agricultural assistant. Be friendly and practical. "+
      "ALWAYS write your entire reply in "+lang+", in a natural, conversational, farmer-friendly register (not overly formal or technical), regardless of what script or language the farmer's own message uses. Only switch to a different language if the farmer explicitly asks you to reply in that other language. "+
      "Use the supplied farm context. Do not invent local facts, diagnoses, pesticide doses, weather, or certainty. If symptoms are uncertain or consequences are important, recommend a qualified agricultural expert. Farmer context: "+contextSummary(state.farmer);
    callClaude(sys, history).then(function(data){
      var reply = extractReply(data);
      state.chat.msgs.push({role:"assistant",content: reply || "The AI provider returned no answer."});
    }).catch(function(err){
      state.chat.msgs.push({role:"assistant",content: "Could not reach the AI: "+err.message});
    }).finally(function(){
      state.chat.busy=false; render();
    });
  }

  function fileToDataUrl(file){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result)); };
      reader.onerror = function(){ reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  function analyzeVision(){
    var v = state.vision;
    if(!v.file) return;
    if(!requireKey()) return;
    v.busy=true; v.result=""; v.error=""; render();
    fileToDataUrl(v.file).then(function(dataUrl){
      var parts = dataUrlParts(dataUrl);
      var lang = state.farmer.language || "English";
      var sys = "You are KrishMitra's agricultural image assistant. Assess only visible clues. Do not claim a definitive disease diagnosis. Explain uncertainty and recommend qualified human agricultural support when needed. Never invent specific product brand names or exact doses \u2014 describe active-ingredient classes and general practice instead, and tell the farmer to confirm exact product and dose with a local expert or input dealer. ALWAYS write your entire reply in "+lang+", in plain, farmer-friendly language.";
      var formatInstructions = "Structure your ENTIRE reply using EXACTLY these four section markers, each on its own line, in this order, with nothing before the first marker and nothing after the last section's content:\n\n"+
        "### CROP ASSESSMENT ###\n"+
        "(Describe visible signs, likely issue(s), what information is missing, and when expert support is appropriate. End this section with a short 'Tips to improve crop health' list of safe, general steps for this week.)\n\n"+
        "### PESTICIDE METHOD ###\n"+
        "(If a pest/disease issue is visible: general chemical/pesticide control approach \u2014 the type or class of pesticide/fungicide typically used for this kind of problem, timing, and safety precautions such as PPE, pre-harvest interval, and label instructions. If no pest/disease is visible, say so briefly.)\n\n"+
        "### ORGANIC METHOD ###\n"+
        "(Purely organic/non-chemical alternative for the same issue \u2014 e.g. neem-based sprays, biocontrol agents, cultural practices, traps, botanical extracts \u2014 with general application guidance.)\n\n"+
        "### COMBINED METHOD ###\n"+
        "(A practical integrated pest management approach that blends organic-first practices with judicious, minimal pesticide use when needed \u2014 explain the sequencing/logic.)\n\n"+
        "Keep each section concise and practical. Never give exact chemical trade names or precise dosages \u2014 always point to confirming exact product/dose with a local agricultural expert or licensed input dealer before applying anything.";
      var userContent = [
        {type:"text",text:"Analyze this crop or soil image.\n\n"+formatInstructions+"\n\nFarmer context: "+contextSummary(state.farmer)}
      ];
      if(parts) userContent.push({type:"image",source:{type:"base64",media_type:parts.mediaType,data:parts.data}});
      return callClaude(sys, [{role:"user",content:userContent}]);
    }).then(function(data){
      var full = extractReply(data) || "The AI provider returned no analysis.";
      v.result = full;
      v.sections = parseMethodSections(full);
    }).catch(function(err){
      v.error = "Could not analyze this image: "+err.message;
      v.sections = null;
    }).finally(function(){
      v.busy=false; render();
    });
  }

  function parseMethodSections(text){
    if(!text) return null;
    var markers = [
      {key:"general", re:/#{2,3}\s*CROP ASSESSMENT\s*#{2,3}/i},
      {key:"pesticide", re:/#{2,3}\s*PESTICIDE METHOD\s*#{2,3}/i},
      {key:"organic", re:/#{2,3}\s*ORGANIC METHOD\s*#{2,3}/i},
      {key:"combined", re:/#{2,3}\s*COMBINED METHOD\s*#{2,3}/i}
    ];
    var found = [];
    markers.forEach(function(m){
      var match = m.re.exec(text);
      if(match) found.push({key:m.key, index:match.index, end:match.index+match[0].length});
    });
    if(found.length===0) return null;
    found.sort(function(a,b){ return a.index-b.index; });
    var sections = {};
    for(var i=0;i<found.length;i++){
      var start = found[i].end;
      var end = (i+1<found.length) ? found[i+1].index : text.length;
      sections[found[i].key] = text.slice(start,end).trim();
    }
    return sections;
  }

  function methodBoxesHtml(sections){
    if(!sections) return "";
    var ui = state.ui.vision;
    var boxes = [
      {key:"pesticide", cls:"pesticide", tag:ui.pesticideTag, title:ui.pesticideTitle},
      {key:"organic", cls:"organic", tag:ui.organicTag, title:ui.organicTitle},
      {key:"combined", cls:"combined", tag:ui.combinedTag, title:ui.combinedTitle}
    ];
    var out = "";
    boxes.forEach(function(b){
      if(sections[b.key]){
        out += '<div class="method-box '+b.cls+'">'+
          '<div class="method-title"><span class="method-tag">'+escapeHtml(b.tag)+'</span>'+escapeHtml(b.title)+'</div>'+
          '<div class="method-body">'+escapeHtml(sections[b.key])+'</div>'+
        '</div>';
      }
    });
    return out ? '<div class="method-stack">'+out+'</div>' : "";
  }

  function analyzeSoil(){
    var s = state.soil;
    if(!s.file) return;
    if(!requireKey()) return;
    var isImage = s.file.type.indexOf("image/")===0;
    var isText = s.file.type==="text/plain"||s.file.type==="text/csv"||s.file.type==="application/json"||/\.(txt|csv|json)$/i.test(s.file.name);
    if(!isImage && !isText){
      s.error="Please upload a JPG, PNG, WebP, CSV, TXT, or JSON soil report.";
      render(); return;
    }
    s.busy=true; s.result=""; s.error=""; render();
    var prep = isImage ? fileToDataUrl(s.file).then(function(url){return {dataUrl:url};})
                        : s.file.text().then(function(t){return {text:t};});
    prep.then(function(payload){
      var reportText = payload.text ? payload.text.trim() : "The report is attached as an image.";
      var prompt = "Analyze this soil test result for a farmer. Use only values visible in the uploaded report and clearly say when a value is missing or uncertain.\n\n"+
        "Return a practical report with these headings:\n1. Soil health summary\n2. Important nutrients and what they mean\n3. Tips to make your soil healthy again (concrete, actionable steps \u2014 organic matter, crop rotation, amendments to ask a local expert about, irrigation/drainage practices)\n4. Crops likely to perform well and why\n5. Next steps and when to consult a local soil/agriculture expert\n\n"+
        "Do not invent lab values, guaranteed yields, fertilizer doses, or local weather. Crop suggestions must be framed as options that also depend on water, season, seed variety, and local advice.\n\n"+
        "File: "+s.file.name+"\nFarmer context: "+contextSummary(state.farmer)+"\nExtracted report text:\n"+reportText;
      var lang = state.farmer.language || "English";
      var sys = "You are a careful soil-health agronomist assistant. Give educational, non-definitive guidance and preserve uncertainty. ALWAYS write your entire reply in "+lang+", in plain, farmer-friendly language.";
      var content = [{type:"text",text:prompt}];
      if(payload.dataUrl){
        var parts = dataUrlParts(payload.dataUrl);
        if(parts) content.push({type:"image",source:{type:"base64",media_type:parts.mediaType,data:parts.data}});
      }
      return callClaude(sys, [{role:"user",content:content}]);
    }).then(function(data){
      s.result = extractReply(data) || "The AI provider returned no soil analysis.";
    }).catch(function(err){
      s.error = "Could not analyze this report: "+err.message;
    }).finally(function(){
      s.busy=false; render();
    });
  }

  /* ---------------- weather + watering reminder ---------------- */
  function geocodeLocality(f){
    var q = [f.village,f.district,f.state,"India"].filter(Boolean).join(", ");
    if(!q) return Promise.resolve(null);
    return fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name="+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.results && d.results[0]) return {lat:d.results[0].latitude, lon:d.results[0].longitude};
        return null;
      }).catch(function(){ return null; });
  }

  function getCoords(f){
    if(f.latitude && f.longitude) return Promise.resolve({lat:f.latitude, lon:f.longitude});
    return geocodeLocality(f);
  }

  function maybeFetchWeather(){
    var w = state.weather;
    if(w.loading) return;
    var fresh = w.fetchedAt && (Date.now()-w.fetchedAt < 3*60*60*1000);
    if(w.data && fresh) return;
    var f = state.farmer;
    if(!f || !f.name) return;
    w.loading = true; w.error=""; render();
    getCoords(f).then(function(coords){
      if(!coords) throw new Error("no-location");
      return fetch("https://api.open-meteo.com/v1/forecast?latitude="+coords.lat+"&longitude="+coords.lon+
        "&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max&timezone=auto&forecast_days=1")
        .then(function(r){ return r.json(); });
    }).then(function(data){
      w.data = data; w.fetchedAt = Date.now();
    }).catch(function(){
      w.error = "unavailable";
    }).finally(function(){
      w.loading = false; render();
    });
  }

  function wateringAdvice(){
    var w = state.weather;
    if(!w.data || !w.data.daily) return null;
    var precip = (w.data.daily.precipitation_sum && w.data.daily.precipitation_sum[0]) || 0;
    var prob = (w.data.daily.precipitation_probability_max && w.data.daily.precipitation_probability_max[0]) || 0;
    if(precip>=2 || prob>=60){
      return "Rain looks likely today ("+Math.round(prob)+"% chance, ~"+precip+"mm). You can probably skip watering \u2014 recheck tomorrow.";
    }
    return "Little to no rain expected today. Consider watering your "+(state.farmer.crop||"crop")+" if the soil feels dry.";
  }

  function reminderCardHtml(){
    var r = state.reminder, w = state.weather;
    var ui = state.ui.reminder;
    var body;
    if(w.loading) body = ui.checking;
    else if(w.error) body = ui.unavailable;
    else { var a = wateringAdvice(); body = a || ui.noLocality; }

    var statusLine = "";
    if(r.status==="watered") statusLine = '<p class="muted" style="margin-top:8px;">'+escapeHtml(ui.markedWatered)+' <button class="btn ghost" data-action="reminder-undo" style="padding:0;">'+escapeHtml(ui.undo)+'</button></p>';
    else if(r.status==="skipped") statusLine = '<p class="muted" style="margin-top:8px;">'+escapeHtml(ui.skipped)+' <button class="btn ghost" data-action="reminder-undo" style="padding:0;">'+escapeHtml(ui.undo)+'</button></p>';
    else if(r.status==="postponed") statusLine = '<p class="muted" style="margin-top:8px;">'+escapeHtml(ui.postponed)+'</p>';

    var actions = r.status ? "" :
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">'+
        '<button class="btn secondary" data-action="reminder-water" style="padding:8px 14px;font-size:13px;">'+escapeHtml(ui.waterBtn)+'</button>'+
        '<button class="btn secondary" data-action="reminder-postpone" style="padding:8px 14px;font-size:13px;">'+escapeHtml(ui.postponeBtn)+'</button>'+
        '<button class="btn ghost" data-action="reminder-skip" style="padding:8px 14px;font-size:13px;">'+escapeHtml(ui.skipBtn)+'</button>'+
      '</div>';

    return '<div class="feature-card" style="margin-bottom:16px;">'+
      '<b>'+escapeHtml(ui.title)+'</b>'+
      '<p>'+escapeHtml(body)+'</p>'+
      statusLine+actions+
    '</div>';
  }

  /* ---------------- boot ---------------- */
  if(state.farmer && state.farmer.language && state.farmer.language !== "English"){
    translateUI(state.farmer.language);
  }
  render();
  setTimeout(function(){
    state.booting=false;
    if(state.farmer && state.farmer.name){
      state.screen = state.farmer.onboardingComplete ? "dash" : "onboard";
    }
    render();
    if(state.screen==="dash") maybeFetchWeather();
  }, 2300);

})();
</script>
</body>
